<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#C41E3A" />
    <title>Au Pair Mongolia</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        background: #FFF9F8;
        color: #1A1418;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(196, 30, 58, 0.22);
      }
      .title {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.2px;
      }
      .sub {
        font-size: 12px;
        color: #8A7478;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(196, 30, 58, 0.15);
        border-top-color: #C41E3A;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="/branding/icon-192.png" alt="APM" />
    <div class="title">Au Pair Mongolia</div>
    <div class="sub">Ачааллаж байна...</div>
    <div class="spinner" aria-hidden="true"></div>
  </body>
</html>
